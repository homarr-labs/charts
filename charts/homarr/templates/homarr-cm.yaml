{{- if and .Values.persistence.homarrTrustedCerts.enabled (eq .Values.persistence.homarrTrustedCerts.type "configmap") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "homarr.fullname" . }}-trusted-certificates-cm
  labels:
    {{- include "homarr.labels" . | nindent 4 }}
{{- with .Values.persistence.homarrTrustedCerts.certificates }}
data:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}

{{- if and .Values.securityContext .Values.securityContext.readOnlyRootFilesystem }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "homarr.fullname" . }}-nginx
  labels:
    {{- include "homarr.labels" . | nindent 4 }}
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }

    http {
        server {
            listen 7575;
            listen [::]:7575;

            # Route websockets traffic to port 3001
            location /websockets {
                proxy_pass http://${HOSTNAME}:3001;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "Upgrade";
                proxy_set_header Host $http_host;
            }

            # Route all other traffic to port 3000
            location / {
                proxy_pass http://${HOSTNAME}:3000;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
                client_max_body_size 32M;
            }
        }
    }
{{- end }}
