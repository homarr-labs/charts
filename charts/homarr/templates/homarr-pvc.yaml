{{- range $key, $persistence := .Values.persistence }}
{{- if and (eq $key "homarrDatabase")
            (or (not (hasKey $.Values "env"))
                (not $.Values.env.DB_HOST)
                (eq $.Values.env.DB_HOST ""))
            $persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $persistence.name }}
spec:
  accessModes:
    - {{ $persistence.accessMode }}
  storageClassName: "{{ $persistence.storageClassName }}"
  resources:
    requests:
      storage: {{ $persistence.size }}
  {{- if $persistence.volumeClaimName }}
  volumeName: "{{ $persistence.volumeClaimName }}"
  {{- end }}

---
{{- end }}

{{- if and (eq $key "homarrImages") $persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $persistence.name }}
spec:
  accessModes:
    - {{ $persistence.accessMode }}
  storageClassName: "{{ $persistence.storageClassName }}"
  resources:
    requests:
      storage: {{ $persistence.size }}
  {{- if $persistence.volumeClaimName }}
  volumeName: "{{ $persistence.volumeClaimName }}"
  {{- end }}

---
{{- end }}

{{- if and (eq $key "homarrTrustedCerts") $persistence.enabled (eq $persistence.type "pvc") }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $persistence.name }}
spec:
  accessModes:
    - {{ $persistence.accessMode }}
  storageClassName: "{{ $persistence.storageClassName }}"
  resources:
    requests:
      storage: {{ $persistence.size }}
  {{- if $persistence.volumeClaimName }}
  volumeName: "{{ $persistence.volumeClaimName }}"
  {{- end }}

---
{{- end }}
{{- end }}
